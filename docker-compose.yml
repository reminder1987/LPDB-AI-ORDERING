services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lpdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d lpdb",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: lpdb-ai-ordering:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: lpdb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
    command:
      [
        "python",
        "-m",
        "alembic",
        "upgrade",
        "head",
      ]
    restart: "no"

  api:
    image: lpdb-ai-ordering:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: lpdb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backup:
    image: postgres:16
    profiles:
      - operations
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./backups:/backups
    command:
      [
        "sh",
        "-c",
        "pg_dump --host=db --port=5432 --username=postgres --dbname=lpdb --format=custom --no-owner --no-acl --file=/backups/lpdb_backup.dump",
      ]
    restart: "no"

  restore:
    image: postgres:16
    profiles:
      - operations
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: lpdb
      DATABASE_USER: postgres
      BACKUP_FILE: /backups/lpdb_backup.dump
    volumes:
      - ./backups:/backups:ro
      - ./scripts/restore_database.sh:/scripts/restore_database.sh:ro
    command:
      [
        "sh",
        "/scripts/restore_database.sh",
      ]
    restart: "no"

volumes:
  postgres_data:
